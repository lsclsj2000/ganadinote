<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header id="sidebar" th:fragment="asideFragment">
    <div class="sidebar-wrapper">
        <div class="sidebar-header">
            <div class="d-flex justify-content-between">
                <a th:href="@{/todo/list}">
                    <img src="/assets/images/logo/ganadinote-logo.png" alt="Logo" srcset="" style="width: 65%; height: auto;">
                </a>
                <div class="toggler">
                    <a href="#" class="sidebar-hide"><i class="bi bi-x bi-middle"></i></a>
                </div>
            </div>
        </div>
        <div class="sidebar-menu">
            <ul class="menu">
                <li class="sidebar-item active has-sub">
                    <a href="#" class='sidebar-link'>
                        <i class="bi bi-stack"></i>
                        <span>My Page</span>
                    </a>
                    <ul class="submenu">
                        <li class="submenu-item">
                            <a th:href="@{/sns/myfeed}">My Page</a>
                        </li>
                        <li class="submenu-item">
                            <a th:href="@{/pet/petInfo}">Pet Add</a>
                        </li>
                        <li class="submenu-item">
                            <a th:href="@{/petCard}">Pet Card</a>
                        </li>
	                    <li class="submenu-item">
	                        <a th:href="@{/notification/settings}">Alarm</a>
	                    </li>
                    </ul>
                </li>
                
                <li class="sidebar-item has-sub">
                	<a href="#" class='sidebar-link'>
                		<i class="bi bi-calendar2-check-fill"></i>
						<span>Todo-List</span>
					</a>
					<ul class="submenu">
						<li class="submenu-item">
							<a th:href="@{/todo/list}">Calendar</a>
						</li>
						<li class="submenu-item">
							<a th:href="@{/routine/list}">Routine</a>
						</li>
					</ul>
				</li>

                <li class="sidebar-item">
                    <a th:href="@{/community}" class='sidebar-link'>
			            <svg class="bi" width="24" height="24" fill="currentColor">
			                <use xlink:href="/assets/vendors/bootstrap-icons/bootstrap-icons.svg#chat-dots"></use>
			            </svg>
			            <span>community</span>
			        </a>
                </li>
                
                <li class="sidebar-item">
                    <a th:href="@{/sns}" class='sidebar-link'>
			            <svg class="bi" width="24" height="24" fill="currentColor">
			                <use xlink:href="/assets/vendors/bootstrap-icons/bootstrap-icons.svg#grid"></use>
			            </svg>
			            <span>SNS</span>
			        </a>
                </li>
                <li class="sidebar-item">
	                <a th:href="@{/weather}" class='sidebar-link'>
	                    <i class="bi bi-cloud-rain"></i>
	                    <span>WEATHER</span>
	                </a>
	            </li>
            
                <li class="sidebar-item" id="login-logout-item">
                    <a href="#" class="sidebar-link">
                        <i class="bi bi-door-open-fill"></i>
                        <span></span>
                    </a>
                </li>
                
            </ul>
        </div>
        <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
    </div>

	<script th:inline="javascript">
		document.addEventListener('DOMContentLoaded', () => {
		  const loginLogoutItem = document.getElementById('login-logout-item');
		  const link = loginLogoutItem.querySelector('a');
		  const textSpan = loginLogoutItem.querySelector('span');
		
		  const mbrCd = getMbrCdFromToken();
		
		  if (mbrCd) {
		    textSpan.textContent = '로그아웃';
		    link.href = '#';
		    link.addEventListener('click', (event) => {
		      event.preventDefault();
		      removeToken();
		      doLogout();
		    });
		  } else {
		    textSpan.textContent = '로그인';
		    link.href = '/login';
		  }
		});
	</script>
</header>
</html>
