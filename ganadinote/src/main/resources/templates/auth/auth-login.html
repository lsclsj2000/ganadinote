<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 가나디노트</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/vendors/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>

<body>
    <div id="auth">
        <div class="row h-100">
            <div class="col-lg-5 col-12">
                <div id="auth-left">
                    <div class="auth-logo">
						<a href="/todo/list">
							<img src="/assets/images/logo/ganadinote-logo.png" alt="Logo" srcset="" style="width:100px;">
						</a>
                    </div>
                    <h1 class="auth-title">로그인</h1>
                    <p class="auth-subtitle mb-0">계정으로 로그인하여</p>
                    <p class="auth-subtitle mb-5">우리 댕댕이 노트를 작성해보세요.</p>

                    <form id="login-form" action="#" method="post">
					    <div class="form-group position-relative has-icon-left mb-4">
					        <input id="login-email" type="text" class="form-control form-control-xl"
							       placeholder="이메일" name="mbrEmail" required autocomplete="username">
					        <div class="form-control-icon">
					            <i class="bi bi-person"></i>
					        </div>
					    </div>
					    <div class="form-group position-relative has-icon-left mb-4">
					        <input id="login-password" type="password" class="form-control form-control-xl"
							       placeholder="비밀번호" name="mbrPw" required autocomplete="current-password">
					        <div class="form-control-icon">
					            <i class="bi bi-shield-lock"></i>
					        </div>
					    </div>
					    <button type="submit" class="btn btn-primary btn-block btn-lg shadow-lg mt-5">로그인</button>
					</form>
                    <div id="login-message" class="text-center mt-3" style="display: none;"></div>
                    <div class="text-center mt-5 text-lg fs-4">
                        <p class="text-gray-600">계정이 없으신가요? <a th:href="@{/register}" class="font-bold">회원가입</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <script>
			document.addEventListener('DOMContentLoaded', () => {
			  const emailEl = document.getElementById('login-email');
			  const pwEl    = document.getElementById('login-password');
			
			  const params = new URLSearchParams(location.search);
			  const mode = params.get('prefill'); // 'demo' | '0' | null
			
			  if (mode === 'demo') {
			    // 항상 데모 계정으로 강제 채우기
			    if (emailEl) emailEl.value = 'tori_ne@ganadinote.com';
			    if (pwEl)    pwEl.value    = 'toritoto9';
			  } else {
			    const skipPrefill = mode === '0';
			    if (!skipPrefill) {
			      const lastEmail = localStorage.getItem('lastLoginEmail');
			
			      if (emailEl && !emailEl.value) {
			        emailEl.value = lastEmail || 'tori_ne@ganadinote.com';
			      }
			      if (pwEl && !pwEl.value && !lastEmail) {
			        pwEl.value = 'toritoto9';
			      }
			    }
			  }
			
			  const loginForm = document.getElementById('login-form');
			  if (loginForm) {
			    loginForm.addEventListener('submit', async (event) => {
			      event.preventDefault();
			
			      const formData = new FormData(loginForm);
			      const requestBody = Object.fromEntries(formData.entries());
			
			      try {
			        const response = await fetch('/api/login', {
			          method: 'POST',
			          headers: { 'Content-Type': 'application/json' },
			          body: JSON.stringify(requestBody)
			        });
			
			        if (response.ok) {
			          const data = await response.json();
			          localStorage.setItem('authToken', data.token);
			
			          // 데모 이메일이면 기록 안 남기기 (다음엔 비번도 자동 채우게 하려면 지우는 게 깔끔)
			          if (requestBody.mbrEmail === 'tori_ne@ganadinote.com') {
			            localStorage.removeItem('lastLoginEmail');
			          } else {
			            localStorage.setItem('lastLoginEmail', requestBody.mbrEmail || '');
			          }
			
			          window.location.href = '/todo/list';
			        } else {
			          alert('이메일 또는 비밀번호가 올바르지 않습니다.');
			        }
			      } catch (error) {
			        console.error('로그인 요청 중 오류:', error);
			        alert('로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
			      }
			    });
			  }
			});
		</script>
</body>

</html>
