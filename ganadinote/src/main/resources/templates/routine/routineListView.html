<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	layout:decorate="~{layout/mainLayoutView}">
<head>
<title>루틴 관리</title>
<link rel="stylesheet" href="/assets/css/routine/routine.css">
</head>
<div layout:fragment="contents">
	<div class="routine-list-page">
		<div class="page-heading">
			<h3>나의 루틴 관리</h3>
		</div>
		<a th:href="@{/routine/addView}" class="btn btn-primary mb-3">새 루틴
			추가하기</a>

		<div th:if="${routines.isEmpty()}" class="no-routines-message">
			<p>등록된 루틴이 없습니다.</p>
		</div>

		<div class="routine-cards-container" th:unless="${routines.isEmpty()}">
			<div class="routine-card" th:each="routine, iterStat : ${routines}"
				th:id="'routineCard-' + ${routine.routineCd}"
				th:onclick="|showEditForm(${routine.routineCd}, ${iterStat.index})|">

				<div class="card-header">
					<span class="pet-name"
						th:text="${pets.?[petCd == #root.routine.petCd][0].petName}">펫
						이름</span> <span class="routine-title" th:text="${routine.routineTitle}">루틴
						제목</span>
				</div>
				<div class="card-body">
					<div class="detail-item">
						<span class="label">반복:</span> <span class="value"
							th:text="${routine.routineRepeatType}"></span>
					</div>
					<div class="detail-item"
						th:if="${routine.routineTimeOfDay != null}">
						<span class="label">시간:</span> <span class="value"
							th:text="${#temporals.format(routine.routineTimeOfDay, 'a hh:mm')}"></span>
					</div>
					<div class="detail-item">
						<span class="label">기간:</span> <span class="value"
							th:text="${#temporals.format(routine.routineStartDate, 'yyyy-MM-dd') + ' ~ ' + #temporals.format(routine.routineEndDate, 'yyyy-MM-dd')}"></span>
					</div>
				</div>
				<div class="card-actions">
					<form th:action="@{/routine/delete}" method="post"
						onsubmit="event.stopPropagation(); return confirm('이 루틴과 관련된 모든 미래의 할 일이 함께 삭제됩니다. 정말 삭제하시겠습니까?');">
						<input type="hidden" name="routineCd"
							th:value="${routine.routineCd}" />
						<button type="submit" class="btn btn-danger btn-sm"
							onclick="event.stopPropagation();">삭제</button>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
/* <![CDATA[ */
    // 컨트롤러에서 받은 데이터를 JavaScript 변수로 저장합니다.
    const routinesFromServer = /*[[${routines}]]*/ [];
    const petsFromServer = /*[[${pets}]]*/ [];

    /**
     * 카드 클릭했을 때, 해당 카드를 수정 폼으로 변경하는 함수
     * @param routineCd - 클릭된 루틴의 고유 ID
     * @param index - routinesFromServer 배열에서의 인덱스
     */
    function showEditForm(routineCd, index) {
        const routine = routinesFromServer[index];
        const card = document.getElementById('routineCard-' + routineCd);

        // 이미 수정 모드이면, 다시 실행되지 않도록 방지
        if (card.classList.contains('edit-mode')) {
            return;
        }
        card.classList.add('edit-mode');
        card.onclick = null; // 수정 모드에서는 카드 클릭 이벤트를 제거

        // 펫 목록 <option> HTML 생성
        let petOptionsHtml = petsFromServer.map(pet => {
            const isSelected = pet.petCd === routine.petCd ? 'selected' : '';
            return `<option value="${pet.petCd}" ${isSelected}>${pet.petName}</option>`;
        }).join('');
        
        // 반복 타입 <option> HTML 생성
        const repeatTypes = ['DAILY', 'WEEKLY', 'MONTHLY'];
        let repeatOptionsHtml = repeatTypes.map(type => {
            const isSelected = type === routine.routineRepeatType ? 'selected' : '';
            return `<option value="${type}" ${isSelected}>${type}</option>`;
        }).join('');

        // 카드의 내부 HTML을 Form으로 완전히 교체
        card.innerHTML = `
            <form action="/routine/update" method="post" class="edit-form-full">
                <input type="hidden" name="routineCd" value="${routine.routineCd}">
                <input type="hidden" name="mbrCd" value="1"> <!-- 임시 회원 ID -->
                
                <div class="form-row">
                    <label>대상</label>
                    <select name="petCd">${petOptionsHtml}</select>
                </div>
                <div class="form-row">
                    <label>제목</label>
                    <input type="text" name="routineTitle" value="${routine.routineTitle}" required>
                </div>
                <div class="form-row">
                    <label>반복</label>
                    <select name="routineRepeatType">${repeatOptionsHtml}</select>
                </div>
                <div class="form-row">
                    <label>시간</label>
                    <input type="time" name="routineTimeOfDay" value="${routine.routineTimeOfDay || ''}">
                </div>
                <div class="form-row">
                    <label>시작일</label>
                    <input type="date" name="routineStartDate" value="${routine.routineStartDate}" required>
                </div>
                <div class="form-row">
                    <label>종료일</label>
                    <input type="date" name="routineEndDate" value="${routine.routineEndDate}" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">저장</button>
                    <button type="button" class="btn btn-secondary" onclick="location.reload()">취소</button>
                </div>
            </form>
        `;
    }
/* ]]> */
</script>
</div>
</html>
